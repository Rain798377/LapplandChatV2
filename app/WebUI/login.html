<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Lappland — Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./nocturne.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); }
  * { box-sizing: border-box; }
  a { color: var(--color-accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .input.smooth { caret-color: transparent; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes caretPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.22; } }
</style>
</helmet>
<div style="min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--color-accent) 12%, transparent), transparent 60%), var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 15px;">

  <div style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 22px; animation: pop 0.24s ease-out;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 11px;">
        <span style="font-family: var(--font-heading); font-size: 22px; font-weight: 600; letter-spacing: -0.015em; color: var(--color-neutral-100);">Lappland</span>
      </div>
      <p style="margin: 0; font-size: 13.5px; color: color-mix(in srgb, var(--color-text) 60%, transparent);">{{ subtitle }}</p>
    </div>

    <div class="elev-md" style="background: var(--color-surface); border-radius: var(--radius-lg); padding: 22px;">
      <form onSubmit="{{ onSubmit }}" style="display: flex; flex-direction: column; gap: 16px;">

        <label class="field">
          <span style="display: block; font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent);">Username or email</span>
          <div style="position: relative;">
            <input class="input smooth" ref="{{ refId }}" value="{{ identifier }}" onChange="{{ onId }}" onKeyUp="{{ trackId }}" onClick="{{ trackId }}" onFocus="{{ focusId }}" onBlur="{{ onBlur }}" autocomplete="username" placeholder="your handle or you@example.com" autofocus />
            <div style="{{ caret.id }}"></div>
          </div>
        </label>

        <label class="field">
          <span style="display: block; font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent);">Password</span>
          <div style="position: relative;">
            <input class="input smooth" type="password" ref="{{ refPass }}" value="{{ password }}" onChange="{{ onPass }}" onKeyUp="{{ trackPass }}" onClick="{{ trackPass }}" onFocus="{{ focusPass }}" onBlur="{{ onBlur }}" autocomplete="{{ passwordAutocomplete }}" placeholder="••••••••" />
            <div style="{{ caret.pass }}"></div>
          </div>
        </label>

        <sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}">
          <label class="field">
            <span style="display: block; font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent);">Confirm password</span>
            <div style="position: relative;">
              <input class="input smooth" type="password" ref="{{ refConfirm }}" value="{{ confirm }}" onChange="{{ onConfirm }}" onKeyUp="{{ trackConfirm }}" onClick="{{ trackConfirm }}" onFocus="{{ focusConfirm }}" onBlur="{{ onBlur }}" autocomplete="new-password" placeholder="••••••••" />
              <div style="{{ caret.confirm }}"></div>
            </div>
          </label>
        </sc-if>

        <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 12.5px; color: oklch(0.72 0.15 25); background: color-mix(in srgb, oklch(0.6 0.18 25) 14%, transparent); border: 1px solid color-mix(in srgb, oklch(0.6 0.18 25) 40%, transparent); border-radius: 8px; padding: 8px 11px;">{{ error }}</div>
        </sc-if>

        <sc-if value="{{ notice }}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 12.5px; color: oklch(0.8 0.12 145); background: color-mix(in srgb, oklch(0.72 0.14 145) 12%, transparent); border: 1px solid color-mix(in srgb, oklch(0.72 0.14 145) 40%, transparent); border-radius: 8px; padding: 8px 11px;">{{ notice }}</div>
        </sc-if>

        <button type="submit" class="btn btn-primary btn-block" disabled="{{ busy }}" style="margin-top: 2px; height: 40px;">{{ submitLabel }}</button>
      </form>
    </div>

    <div style="display: flex; justify-content: center; gap: 6px; font-size: 13px; color: color-mix(in srgb, var(--color-text) 55%, transparent);">
      <span>{{ switchPrompt }}</span>
      <a href="#" onClick="{{ toggleMode }}" style="cursor: pointer;">{{ switchAction }}</a>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;redirectTo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;./index.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;caretEase&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:150,&quot;min&quot;:0,&quot;max&quot;:400,&quot;step&quot;:10,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
const FIELDS = ["id", "pass", "confirm"];
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      mode: "login", // "login" | "register"
      identifier: "", password: "", confirm: "",
      busy: false, error: "", notice: "",
      focus: null, typing: false,
      caretX: { id: 0, pass: 0, confirm: 0 }
    };
    this._els = {};
  }

  componentWillUnmount() { clearTimeout(this._idle); }

  // ── smooth caret ──────────────────────────────────────────────────────
  // The native caret is hidden (.input.smooth) and replaced by an accent bar
  // whose `left` is transitioned, so it glides to the new position instead of
  // snapping. Position is measured by drawing the text-before-caret into a
  // canvas with the input's own computed font.
  _measureCtx() {
    if (!this.__cv) this.__cv = document.createElement("canvas");
    return this.__cv.getContext("2d");
  }

  measure(field) {
    const el = this._els[field];
    if (!el) return;
    const cs = getComputedStyle(el);
    const ctx = this._measureCtx();
    ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
    const masked = el.type === "password";
    // Password glyphs render as bullets; measure that run instead of the value.
    const text = masked ? "\u2022".repeat(pos) : el.value.slice(0, pos);
    const w = ctx.measureText(text).width + (masked ? pos * 0.6 : 0);
    const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth);
    const x = pad + w - el.scrollLeft;
    const max = el.clientWidth + parseFloat(cs.borderLeftWidth) - 2;
    this.setState(s => ({ caretX: { ...s.caretX, [field]: Math.max(pad, Math.min(x, max)) } }));
  }

  track = field => {
    clearTimeout(this._idle);
    this.setState({ typing: true });
    this._idle = setTimeout(() => this.setState({ typing: false }), 850);
    requestAnimationFrame(() => this.measure(field));
  };

  focusField = field => {
    this.setState({ focus: field });
    requestAnimationFrame(() => this.measure(field));
  };

  caretStyle(field) {
    const on = this.state.focus === field;
    const ease = this.props.caretEase ?? 150;
    const pulse = on && !this.state.typing ? "animation:caretPulse 1.2s ease-in-out infinite;" : "";
    return `position:absolute;left:${this.state.caretX[field]}px;top:9px;bottom:9px;width:1.5px;`
      + `border-radius:1px;background:var(--color-accent);pointer-events:none;`
      + `opacity:${on ? 1 : 0};`
      + `transition:left ${ease}ms cubic-bezier(.2,.75,.2,1),opacity 130ms linear;${pulse}`;
  }

  // ── submit ────────────────────────────────────────────────────────────
  onSubmit = e => {
    e.preventDefault();
    const { mode, identifier, password, confirm } = this.state;
    const id = identifier.trim();
    if (!id || !password) {
      this.setState({ error: "Enter your username or email, and a password.", notice: "" });
      return;
    }
    if (mode === "register" && password !== confirm) {
      this.setState({ error: "Passwords don't match.", notice: "" });
      return;
    }

    // One field, either kind of credential: an address goes up as `email`,
    // anything else as `username`. `identifier` carries the raw input so the
    // backend can resolve it however it likes.
    const isEmail = EMAIL_RE.test(id);
    const endpoint = mode === "register" ? "/api/register" : "/api/login";
    this.setState({ busy: true, error: "", notice: "" });

    fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        identifier: id,
        username: isEmail ? null : id,
        email: isEmail ? id : null,
        password
      })
    })
      .then(res => res.json().then(data => ({ ok: res.ok, data })).catch(() => ({ ok: res.ok, data: {} })))
      .then(({ ok, data }) => {
        if (ok) {
          if (mode === "register" && data && data.pending) {
            this.setState({ busy: false, notice: "Account created. You can sign in now.", mode: "login", password: "", confirm: "" });
            return;
          }
          window.location.href = this.props.redirectTo ?? "./index.html";
          return;
        }
        this.setState({ busy: false, error: (data && (data.detail || data.error)) || "Sign in failed. Check your details." });
      })
      .catch(() => this.setState({ busy: false, error: "Can't reach the server. Is the backend running?" }));
  };

  renderVals() {
    const st = this.state;
    const isRegister = st.mode === "register";
    const caret = {};
    for (const f of FIELDS) caret[f] = this.caretStyle(f);

    return {
      subtitle: isRegister ? "Create an account to start chatting." : "Sign in to pick up where you left off.",
      identifier: st.identifier,
      password: st.password,
      confirm: st.confirm,
      isRegister,
      error: st.error,
      notice: st.notice,
      busy: st.busy,
      caret,
      passwordAutocomplete: isRegister ? "new-password" : "current-password",
      submitLabel: st.busy ? "Please wait…" : (isRegister ? "Create account" : "Sign in"),
      switchPrompt: isRegister ? "Already have an account?" : "New here?",
      switchAction: isRegister ? "Sign in" : "Create an account",

      refId: el => { this._els.id = el; },
      refPass: el => { this._els.pass = el; },
      refConfirm: el => { this._els.confirm = el; },

      onId: e => { this.setState({ identifier: e.target.value }); this.track("id"); },
      onPass: e => { this.setState({ password: e.target.value }); this.track("pass"); },
      onConfirm: e => { this.setState({ confirm: e.target.value }); this.track("confirm"); },

      trackId: () => this.track("id"),
      trackPass: () => this.track("pass"),
      trackConfirm: () => this.track("confirm"),

      focusId: () => this.focusField("id"),
      focusPass: () => this.focusField("pass"),
      focusConfirm: () => this.focusField("confirm"),
      onBlur: () => this.setState({ focus: null }),

      toggleMode: e => { e.preventDefault(); this.setState(s => ({ mode: s.mode === "login" ? "register" : "login", error: "", notice: "", confirm: "" })); }
    };
  }
}

</script>
</body>
</html>
