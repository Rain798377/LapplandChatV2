<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Lappland — Sign in</title>
<link rel="stylesheet" href="./nocturne.css" />
<link rel="stylesheet" href="./login.css" />
</head>
<body>
  <div class="login-card">
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;align-items:center;gap:11px;">
        <span style="font-family:var(--font-heading);font-size:22px;font-weight:600;letter-spacing:-0.015em;color:var(--color-neutral-100);">Lappland</span>
      </div>
      <p id="subtitle" style="margin:0;font-size:13.5px;color:color-mix(in srgb, var(--color-text) 60%, transparent);">Sign in to pick up where you left off.</p>
    </div>

    <div class="elev-md" style="background:var(--color-surface);border-radius:var(--radius-lg);padding:22px;">
      <form id="authForm" style="display:flex;flex-direction:column;gap:16px;">
        <label class="field" id="identifierField">
          <span style="display:block;font-size:12px;margin-bottom:5px;color:color-mix(in srgb, var(--color-text) 70%, transparent);">Username or email</span>
          <input class="input" id="identifier" autocomplete="username" placeholder="your handle or you@example.com" autofocus />
        </label>
        <label class="field" id="emailField" style="display:none;">
          <span style="display:block;font-size:12px;margin-bottom:5px;color:color-mix(in srgb, var(--color-text) 70%, transparent);">Email</span>
          <input class="input" type="email" id="email" autocomplete="email" placeholder="you@example.com" />
        </label>
        <label class="field" id="usernameField" style="display:none;">
          <span style="display:block;font-size:12px;margin-bottom:5px;color:color-mix(in srgb, var(--color-text) 70%, transparent);">Username</span>
          <input class="input" id="username" autocomplete="username" placeholder="your handle" />
        </label>
        <label class="field">
          <span style="display:block;font-size:12px;margin-bottom:5px;color:color-mix(in srgb, var(--color-text) 70%, transparent);">Password</span>
          <input class="input" type="password" id="password" autocomplete="current-password" placeholder="••••••••" />
        </label>
        <label class="field" id="confirmField" style="display:none;">
          <span style="display:block;font-size:12px;margin-bottom:5px;color:color-mix(in srgb, var(--color-text) 70%, transparent);">Confirm password</span>
          <input class="input" type="password" id="confirm" autocomplete="new-password" placeholder="••••••••" />
        </label>

        <div id="error"></div>
        <div id="notice"></div>

        <label class="checkbox-row" id="trackingField" style="display:none;">
          <input type="checkbox" id="trackingConsent" />
          <span>Your email will <strong>not</strong> be used for tracking — it's kept only to identify your account.</span>
        </label>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="margin-top:2px;height:40px;">Sign in</button>
      </form>
    </div>

    <div style="display:flex;justify-content:center;gap:6px;font-size:13px;color:color-mix(in srgb, var(--color-text) 55%, transparent);">
      <span id="switchPrompt">New here?</span>
      <a href="#" id="toggleMode">Create an account</a>
    </div>
  </div>

<script src="./login.js"></script>
</body>
</html>
