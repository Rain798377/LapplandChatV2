<script type="text/x-dc" data-dc-script>
// Settings live in arkendpoint.config.js — edit that file in a text editor.
const FALLBACK = {
  MODE: "cycle",
  STATIC_IMAGE: "assets/backdrops/bg-1.png",
  IMAGES: [1,2,3,4,5,6].map(n => `assets/backdrops/bg-${n}.png`),
  HOLD_SECONDS: 8,
  RANDOM_ON_LOAD: true,
  HUE_FOLLOWS_IMAGE: true,
  BASE_HUE: 262,
  OVERLAY_OPACITY: 0.68,
  BG_BRIGHTNESS: 1,
  BLOOM_STRENGTH: 0.18,
  VIGNETTE_OPACITY: 0.9,
  CROSSFADE_SECONDS: 2.2,
  DRIFT_ZOOM: true,
  RINGS: true,
  RINGS_OPACITY: 0.025,
  SHOW_CLOCK: true,
  CLOCK_24_HOUR: false,
};

function hueOf(src) {
  return new Promise(resolve => {
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = () => {
      try {
        const s = 48, cv = document.createElement("canvas");
        cv.width = s; cv.height = s;
        const cx = cv.getContext("2d");
        cx.drawImage(im, 0, 0, s, s);
        const d = cx.getImageData(0, 0, s, s).data;
        let vx = 0, vy = 0, wsum = 0, lsum = 0;
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
          const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
          lsum += l;
          const c = mx - mn;
          if (c < 0.02) continue;
          let h;
          if (mx === r) h = ((g - b) / c) % 6;
          else if (mx === g) h = (b - r) / c + 2;
          else h = (r - g) / c + 4;
          h *= 60; if (h < 0) h += 360;
          const w = c * (1 - Math.abs(2 * l - 1) * 0.4);
          vx += Math.cos(h * Math.PI / 180) * w;
          vy += Math.sin(h * Math.PI / 180) * w;
          wsum += w;
        }
        if (!wsum) return resolve(null);
        let h = Math.atan2(vy, vx) * 180 / Math.PI;
        if (h < 0) h += 360;
        resolve({ hue: Math.round(h), light: lsum / (d.length / 4) });
      } catch (e) { resolve(null); }
    };
    im.onerror = () => resolve(null);
    im.src = src;
  });
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.cfg = FALLBACK;
    this.state = { i: 0, hue: FALLBACK.BASE_HUE };
    this._hues = {};
  }

  async loadConfig() {
    try {
      const m = await import("./arkendpoint.config.js");
      this.cfg = { ...FALLBACK, ...m };
    } catch (e) {
      console.warn("arkendpoint.config.js not loaded — using defaults", e);
    }
    const srcs = this.sources();
    srcs.forEach(s => { const im = new Image(); im.src = s; });
    const start = this.cfg.RANDOM_ON_LOAD && srcs.length ? Math.floor(Math.random() * srcs.length) : 0;
    this._sampled = null;
    this.setState({ i: start, hue: this.cfg.BASE_HUE });
    clearInterval(this._t);
    if (srcs.length > 1) {
      const hold = Math.max(3, Number(this.cfg.HOLD_SECONDS)) * 1000;
      this._t = setInterval(() => this.setState(s => ({ i: s.i + 1 })), hold);
    }
  }

  async sampleCurrent() {
    try {
      const srcs = this.sources();
      if (!srcs.length) return;
      const src = srcs[((this.state.i % srcs.length) + srcs.length) % srcs.length];
      if (!src) return;
      this._sampled = this.state.i;
      if (!this.cfg.HUE_FOLLOWS_IMAGE) return;
      if (this._hues[src] === undefined) this._hues[src] = await hueOf(src);
      const got = this._hues[src];
      if (got && got.hue !== this.state.hue) this.setState({ hue: got.hue });
    } catch (e) { console.error("hue sample failed", e); }
  }

  componentDidUpdate() {
    if (this._sampled !== this.state.i) this.sampleCurrent();
  }

  sources() {
    const c = this.cfg;
    if (c.MODE === "static") return [c.STATIC_IMAGE].filter(Boolean);
    const list = (c.IMAGES || []).map(s => String(s).trim()).filter(Boolean);
    return list.length ? list : [c.STATIC_IMAGE].filter(Boolean);
  }

  componentDidMount() {
    this.loadConfig();
    this._clock = setInterval(() => this.forceUpdate(), 10000);
  }

  componentWillUnmount() { clearInterval(this._t); clearInterval(this._clock); }

  clock() {
    const now = new Date();
    const hour12 = !this.cfg.CLOCK_24_HOUR;
    let time = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", hour12 }).format(now);
    let zone = "";
    try {
      const parts = new Intl.DateTimeFormat(undefined, { timeZoneName: "short" }).formatToParts(now);
      zone = (parts.find(p => p.type === "timeZoneName") || {}).value || "";
    } catch (e) { zone = ""; }
    const date = new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" }).format(now);
    return { time, zone, date };
  }

  renderVals() {
    const srcs = this.sources();
    const i = this.state.i;
    const at = k => srcs[((k % srcs.length) + srcs.length) % srcs.length];
    const aIsCurrent = i % 2 === 0;
    const h = this.state.hue;
    const c = this.cfg;
    const t = Math.max(0.2, Number(c.CROSSFADE_SECONDS) || 2.2);
    const bloom = Math.max(0, Math.min(1, Number(c.BLOOM_STRENGTH ?? 0.18)));
    const vig = Math.max(0, Math.min(1, Number(c.VIGNETTE_OPACITY ?? 0.9)));
    const brightness = Math.max(0, Number(c.BG_BRIGHTNESS ?? 1));
    const LAYER = {
      position: "absolute", inset: 0,
      backgroundSize: "cover", backgroundPosition: "center",
      filter: `brightness(${brightness})`,
      transition: `opacity ${t}s ease-in-out, filter ${t}s ease-in-out`,
      animation: c.DRIFT_ZOOM ? "ark-drift 26s linear infinite alternate" : "none",
    };
    const ease = `color ${t}s ease-in-out, background ${t}s ease-in-out, text-shadow ${t}s ease-in-out`;
    return {
      styleA: { ...LAYER, backgroundImage: `url("${at(aIsCurrent ? i : i - 1)}")`, opacity: aIsCurrent ? 1 : 0 },
      styleB: { ...LAYER, backgroundImage: `url("${at(aIsCurrent ? i - 1 : i)}")`, opacity: aIsCurrent ? 0 : 1 },
      scrimStyle: {
        position: "absolute", inset: 0, pointerEvents: "none",
        background: `rgba(8, 9, 16, ${Math.max(0, Math.min(1, Number(c.OVERLAY_OPACITY ?? 0.68)))})`,
        transition: `background ${t}s ease-in-out`,
      },
      bloomStyle: {
        position: "absolute", inset: 0, pointerEvents: "none",
        background: `radial-gradient(120% 90% at 50% 45%, hsl(${h} 52% 62% / ${bloom}) 0%, hsl(${h} 30% 10% / ${vig * 0.61}) 55%, hsl(${h} 32% 6% / ${vig}) 100%)`,
        animation: "ark-glow 9s ease-in-out infinite",
        transition: `background ${t}s ease-in-out`,
      },
      clockTime: this.cfg.SHOW_CLOCK === false ? "" : this.clock().time,
      clockMeta: this.cfg.SHOW_CLOCK === false ? "" : [this.clock().zone, this.clock().date].filter(Boolean).join(" · "),
      clockStyle: {
        position: "absolute", right: 40, bottom: 34, textAlign: "right",
        display: this.cfg.SHOW_CLOCK === false ? "none" : "flex",
        flexDirection: "column", gap: 4, pointerEvents: "none",
        fontFamily: "'Barlow Condensed', Inter, sans-serif",
        textTransform: "uppercase", letterSpacing: "0.2em",
        animation: "ark-fade 1.2s ease-out 1.6s both", transition: ease,
      },
      clockTimeStyle: { fontSize: 15, color: `hsl(${h} 24% 78%)`, transition: ease },
      clockMetaStyle: { fontSize: 11, letterSpacing: "0.24em", color: `hsl(${h} 12% 58%)`, transition: ease },
      ringsOuterStyle: {
        position: "absolute", left: "50%", bottom: "-78vmin",
        width: "108vmin", height: "108vmin", pointerEvents: "none",
        transformOrigin: "50% 50%", color: `hsl(${h} 45% 82%)`,
        opacity: c.RINGS === false ? 0 : Math.max(0, Math.min(1, Number(c.RINGS_OPACITY ?? 0.025))),
        animation: "ark-spin 240s linear infinite",
        transition: `color ${t}s ease-in-out`,
      },
      ringsInnerStyle: {
        position: "absolute", left: "50%", bottom: "-78vmin",
        width: "108vmin", height: "108vmin", pointerEvents: "none",
        transformOrigin: "50% 50%", color: `hsl(${h} 45% 82%)`,
        opacity: c.RINGS === false ? 0 : Math.max(0, Math.min(1, Number(c.RINGS_OPACITY ?? 0.025))),
        animation: "ark-spin-rev 360s linear infinite",
        transition: `color ${t}s ease-in-out`,
      },
      markStyle: {
        color: `hsl(${h} 55% 70%)`, marginBottom: 26, opacity: 0.9,
        textShadow: "0 1px 2px rgba(0, 0, 0, 0.95), 0 2px 12px rgba(0, 0, 0, 0.7)",
        animation: "ark-fade 1s ease-out 0s both", transition: ease,
      },
      kickerStyle: {
        fontFamily: "'Barlow Condensed', Inter, sans-serif", fontSize: 13,
        letterSpacing: "0.42em", textTransform: "uppercase",
        color: `hsl(${h} 20% 88%)`, marginBottom: 34,
        textShadow: "0 1px 2px rgba(0, 0, 0, 1), 0 2px 12px rgba(0, 0, 0, 0.75)",
        animation: "ark-fade 1s ease-out 0.1s both", transition: ease,
      },
      titleStyle: {
        // wordmark font history: Inter 500 (Nocturne --font-heading) → Outfit → Geist
        margin: 0, fontFamily: "'Geist', 'Outfit', Inter, system-ui, sans-serif",
        fontWeight: 500, fontSize: "clamp(48px, 11.5vw, 176px)",
        lineHeight: 0.95, letterSpacing: "0.02em", display: "flex", gap: "0.01em",
        textShadow: `0 0 60px hsl(${h} 55% 68% / 0.38)`, transition: ease,
      },
      ruleStyle: {
        width: "min(520px, 70vw)", height: 2, margin: "30px 0 26px",
        background: `linear-gradient(90deg, transparent, hsl(${h} 55% 70%) 22%, hsl(${h} 55% 70%) 78%, transparent)`,
        transformOrigin: "center",
        animation: "ark-rule 1.1s cubic-bezier(0.16, 0.84, 0.24, 1) 0.95s both",
        transition: "background 2.2s ease-in-out",
      },
      subheadStyle: {
        margin: 0, fontSize: "clamp(17px, 2.1vw, 26px)", letterSpacing: "0.01em",
        color: `hsl(${h} 22% 84%)`,
        textShadow: "0 1px 2px rgba(0, 0, 0, 0.75), 0 2px 12px rgba(0, 0, 0, 0.55)",
        animation: "ark-fade 1.1s ease-out 1.25s both", transition: ease,
      },
    };
  }
}
</script>

<!-- ── Hidden "~" terminal ──────────────────────────────────────────────
     Deliberately plain vanilla HTML/CSS/JS living OUTSIDE <x-dc>...</x-dc>
     (the DC runtime's boot() in support.js only ever touches the <x-dc>
     element itself -- dc.replaceWith(hostEl) -- so anything out here in
     the raw document is left alone by the React-managed template/diffing
     and behaves like a normal static page).

     Same-origin gate mechanics as the plain-cover version of this page
     (see webui_server.py's POST /gate) -- this page IS served by that same
     backend now (see WEBUI_DIR/cover.html), so it can just POST + reload
     instead of redirecting to a different domain. -->
<style>
  #term {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(0, 0, 0, 0.88);
    align-items: flex-start; justify-content: center;
    padding-top: 14vh; font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  }
  #term.open { display: flex; }
  #termBox {
    width: min(520px, 90vw); background: #050505; border: 1px solid #222;
    border-radius: 6px; padding: 14px 16px; color: #d4d4d4; font-size: 14px;
  }
  #termLog { white-space: pre-wrap; min-height: 1.4em; margin-bottom: 4px; }
  #termLine { display: flex; gap: 8px; align-items: center; }
  #termPrompt { color: #6b6b70; }
  #termInput {
    flex: 1; background: transparent; border: 0; outline: none; color: inherit;
    font: inherit; caret-color: #d4d4d4;
  }
</style>

<div id="term">
  <div id="termBox">
    <div id="termLog"></div>
    <div id="termLine">
      <span id="termPrompt">&gt;</span>
      <input id="termInput" autocomplete="off" spellcheck="false" />
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var term = document.getElementById("term");
  var log = document.getElementById("termLog");
  var input = document.getElementById("termInput");
  var busy = false;

  function open() {
    term.classList.add("open");
    log.textContent = "";
    input.value = "";
    input.focus();
  }
  function close() {
    term.classList.remove("open");
  }

  document.addEventListener("keydown", function (e) {
    if (term.classList.contains("open")) {
      if (e.key === "Escape") close();
      return;
    }
    if (e.key === "`" || e.key === "~") {
      e.preventDefault();
      open();
    }
  });
  term.addEventListener("click", function (e) {
    if (e.target === term) close();
  });

  input.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || busy) return;
    var value = input.value;
    input.value = "";
    if (!value.trim()) return;
    busy = true;
    log.textContent = "connecting...";
    fetch("gate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input: value }),
    })
      .then(function (res) {
        if (res.ok) {
          log.textContent = "access granted.";
          setTimeout(function () { window.location.reload(); }, 250);
          return;
        }
        log.textContent = "access denied.";
        busy = false;
        input.focus();
      })
      .catch(function () {
        log.textContent = "connection failed.";
        busy = false;
        input.focus();
      });
  });
})();
</script>
