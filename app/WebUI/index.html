<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Lappland</title>
<link rel="stylesheet" href="./nocturne.css" />
<link rel="stylesheet" href="./chat.css" />
</head>
<body>
<div id="app" style="height: 100vh; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.55; overflow: hidden;">

  <aside style="width: 224px; flex: none; display: flex; flex-direction: column; background: color-mix(in srgb, var(--color-bg) 78%, #000); border-right: 1px solid var(--color-divider);">
    <div style="padding: 18px 16px 14px; border-bottom: 1px solid var(--color-divider); display: flex; flex-direction: column; gap: 3px;">
      <div id="botNameLabel" style="font-family: var(--font-heading); font-size: 17px; font-weight: 600; color: var(--color-neutral-100); letter-spacing: -0.015em;">Lappland</div>
      <div id="modelLabel" style="font-size: 11px; color: color-mix(in srgb, var(--color-text) 45%, transparent);">…</div>
    </div>

    <div class="scroll" style="flex: 1; overflow-y: auto; padding: 16px 8px; display: flex; flex-direction: column; gap: 20px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 45%, transparent); padding: 0 8px 6px;">Channels</div>
        <div id="channelListOuter" style="position: relative;">
          <div id="channelHighlight" style="position: absolute; left: 0; right: 0; top: 0; height: 0; border-radius: 8px; background: color-mix(in srgb, var(--color-accent) 15%, transparent); transition: transform 0.2s cubic-bezier(0.2, 0.75, 0.2, 1), height 0.15s ease; pointer-events: none;"></div>
          <div id="channelList" style="position: relative; display: flex; flex-direction: column; gap: 2px;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 45%, transparent); padding: 0 8px 6px;">Here</div>
        <div id="memberList" style="display: flex; flex-direction: column; gap: 2px;"></div>
      </div>

      <button id="resetBtn" class="btn btn-secondary" style="display: none; justify-content: flex-start; width: 100%; font-size: 13px;"></button>
    </div>

    <button id="accountBtn" class="account-btn" style="display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--color-divider); background: transparent; cursor: pointer; padding: 11px;">
      <div id="youAvatar"></div>
      <div style="flex: 1; min-width: 0;">
        <div id="youName" style="font-size: 13px; color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">…</div>
        <div style="font-size: 10px; color: color-mix(in srgb, var(--color-text) 45%, transparent);">online</div>
      </div>
      <span style="font-size: 15px; color: color-mix(in srgb, var(--color-text) 45%, transparent);">&#9881;</span>
    </button>
  </aside>

  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
    <header style="flex: none; height: 56px; padding: 0 20px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--color-divider); background: var(--color-bg);">
      <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
        <span id="statusDot" style="width: 6px; height: 6px; border-radius: 50%;"></span>
        <span style="color: color-mix(in srgb, var(--color-text) 45%, transparent); font-size: 15px;">#</span>
        <span id="activeName" style="font-family: var(--font-heading); font-weight: 600; color: var(--color-neutral-100);">general</span>
      </div>
      <div style="width: 1px; height: 22px; background: var(--color-divider);"></div>
      <div id="statusLine" style="flex: 1; min-width: 0; font-size: 12px; color: color-mix(in srgb, var(--color-text) 65%, transparent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></div>
      <button id="detailsBtn" class="btn btn-secondary" style="font-size: 12px; padding: 5px 12px;">details</button>
    </header>

    <div style="flex: 1; min-width: 0; display: flex; overflow: hidden;">
      <div class="scroll" id="messageScroll" style="flex: 1; min-width: 0; overflow-y: auto; padding: 26px 20px 8px;">
        <div style="max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 2px;">

          <div style="padding: 0 8px 18px; display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px;">
            <div id="conversationLabel" style="font-size: 11px; color: color-mix(in srgb, var(--color-text) 45%, transparent);"></div>
            <div style="flex: 1; height: 1px; background: linear-gradient(to right, var(--color-divider), transparent);"></div>
          </div>

          <div id="messageList"></div>

          <div id="typingRow" style="display: none; gap: 12px; padding: 7px 12px 7px 8px;">
            <div style="width: 38px; flex: none;"><div id="typingAvatar"></div></div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <span id="typingLabel" style="font-size: 13px; color: color-mix(in srgb, var(--color-text) 65%, transparent);"></span>
              <span style="display: flex; gap: 4px;">
                <span style="width: 5px; height: 5px; border-radius: 50%; background: var(--color-accent); animation: blip 1.1s infinite;"></span>
                <span style="width: 5px; height: 5px; border-radius: 50%; background: var(--color-accent); animation: blip 1.1s 0.15s infinite;"></span>
                <span style="width: 5px; height: 5px; border-radius: 50%; background: var(--color-accent); animation: blip 1.1s 0.3s infinite;"></span>
              </span>
            </div>
          </div>

          <div style="height: 14px;"></div>
        </div>
      </div>

      <aside id="infoPanel" class="scroll" style="width: 272px; flex: none; overflow-y: auto; border-left: 1px solid var(--color-divider); background: var(--color-surface); padding: 18px 16px; display: flex; flex-direction: column; gap: 22px;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent);">Runtime</div>
          <div id="runtimeList" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent);">About</div>
          <div id="aboutText" style="font-size: 13px; color: color-mix(in srgb, var(--color-text) 70%, transparent); background: var(--color-bg); border: 1px solid var(--color-divider); border-radius: 8px; padding: 11px; line-height: 1.5;"></div>
        </div>
      </aside>
    </div>

    <div style="flex: none; padding: 4px 20px 20px; background: var(--color-bg);">
      <div style="max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 7px;">
        <div class="composer-box" style="display: flex; align-items: flex-end; gap: 10px; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 10px; padding: 10px 10px 10px 14px;">
          <textarea id="draftInput" rows="1" placeholder="" style="flex: 1; min-width: 0; resize: none; background: transparent; border: 0; outline: none; color: var(--color-text); font-size: 15px; line-height: 1.5; max-height: 160px; padding: 4px 0;"></textarea>
          <button id="sendBtn" class="send-btn" style="flex: none; cursor: default; font-family: var(--font-heading); font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 8px; background: transparent; border: 1px solid var(--color-divider); color: color-mix(in srgb, var(--color-text) 35%, transparent);">Send</button>
        </div>
        <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 10.5px; color: color-mix(in srgb, var(--color-text) 40%, transparent);">
          <span>Enter to send &middot; Shift+Enter for a new line</span>
          <span id="charCount"></span>
        </div>
      </div>
    </div>
  </main>

  <div id="settingsBackdrop" class="dialog-backdrop" style="display: none; z-index: 40;">
    <div id="settingsDialog" class="scroll elev-lg" style="width: 100%; max-width: 520px; max-height: 86vh; overflow-y: auto; background: var(--color-surface); border-radius: var(--radius-lg); animation: pop 0.16s ease-out;">

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--color-divider); position: sticky; top: 0; background: var(--color-surface); z-index: 1;">
        <div style="font-family: var(--font-heading); font-size: 18px; font-weight: 500; color: var(--color-neutral-100);">Settings</div>
        <button id="settingsCloseX" class="btn btn-icon btn-ghost" style="font-size: 20px; color: color-mix(in srgb, var(--color-text) 50%, transparent);">&times;</button>
      </div>

      <div style="padding: 20px; display: flex; flex-direction: column; gap: 26px;">

        <section style="display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent);">Account</div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
            <span id="accountLine" style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text);"></span>
            <button id="logoutBtn" class="btn btn-ghost" style="font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 65%, transparent);">Log out</button>
          </div>
        </section>

        <section style="display: flex; flex-direction: column; gap: 12px;">
          <div style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent);">Profile</div>
          <div style="display: flex; align-items: center; gap: 14px;">
            <div id="bigAvatar"></div>
            <div style="display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 0;">
              <div style="display: flex; gap: 8px;">
                <button id="pickPhotoBtn" class="btn btn-secondary" style="font-size: 12.5px;">Upload photo</button>
                <button id="clearPhotoBtn" class="btn btn-ghost" style="font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 65%, transparent);">Remove</button>
              </div>
              <div style="font-size: 10.5px; color: color-mix(in srgb, var(--color-text) 45%, transparent);">Stored in this browser only.</div>
            </div>
          </div>
          <input type="file" accept="image/*" id="photoInput" style="display: none;" />

          <div class="field">
            <span style="display: block; font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent);">Avatar colour</span>
            <div id="swatchList" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
          </div>
        </section>

        <section style="display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent);">Stored data</div>
          <div id="storageNote" style="font-size: 13px; color: color-mix(in srgb, var(--color-text) 65%, transparent);"></div>
          <div style="display: flex; gap: 8px;">
            <button id="clearHistoryBtn" class="btn btn-secondary" style="display: none; font-size: 12.5px;">Clear chat history</button>
            <button id="resetAllBtn" class="btn btn-ghost" style="font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 65%, transparent);">Reset everything</button>
          </div>
        </section>
      </div>

      <div style="padding: 14px 20px; border-top: 1px solid var(--color-divider); display: flex; justify-content: flex-end; position: sticky; bottom: 0; background: var(--color-surface);">
        <button id="settingsDoneBtn" class="btn btn-primary">Done</button>
      </div>
    </div>
  </div>

</div>

<script src="./chat.js"></script>
</body>
</html>
