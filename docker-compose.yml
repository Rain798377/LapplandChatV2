services:
  webui:
    build: .
    command: ["python", "webui_server.py"]
    container_name: lappland-webui
    restart: unless-stopped
    ports:
      - "9021:9021"
    volumes:
      - ./app:/app
      - ./data:/app/data
      # Secrets/config come from .env-webui (config.py loads it directly),
      # not this file -- keeps this deployment independent of the Discord
      # bot's .env, which stays on the NAS but out of this container.
      - ./.env-webui:/.env-webui
